<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #faf7f0;
        color: #2b2b28;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        text-align: center;
        padding: 1.5rem;
      }
      div {
        max-width: 22rem;
      }
      h1 {
        font-size: 1.25rem;
        margin-bottom: 0.5rem;
      }
      p {
        color: #6b6b64;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>You're offline</h1>
      <p>
        This page hasn't been opened before, so it can't load without a connection. Pages you've
        already visited — like a lesson's attendance sheet — will still work.
      </p>
    </div>
  </body>
</html>
